<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day10 表单与可访问性</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, sans-serif;
            padding: 32px 16px;
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.6;
        }

        h1 {
            margin-bottom: 24px;
            font-size: 22px;
        }

        .form-item {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #aaa;
            border-radius: 6px;
            font-size: 16px;
        }

        input:focus,
        button:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
        }

        button {
            padding: 10px 24px;
            background-color: #2563eb;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>
    <h1>信息收集表单</h1>
    <form action="#">
        <div class="form-item">
            <label for="name">姓名</label>
            <input type="text" id="name" name="username" placeholder="请输入姓名">
        </div>

        <div class="form-item">
            <label for="email">邮箱</label>
            <input type="email" id="email" name="useremail" placeholder="请输入邮箱">
        </div>

        <button type="submit">提交</button>
    </form>
</body>
</html>
